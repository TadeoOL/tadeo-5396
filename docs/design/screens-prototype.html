<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screens prototype</title>
<!-- Rough artifact to react to, not the build. Every screen and state from screens.md, laid out as a gallery. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e6de; color: var(--foreground); font-family: var(--font-sans); font-size: 1rem; line-height: 1.5; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  h1, h2, h3 { font-stretch: 75%; font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.1; margin: 0; }
  h1, h2 { font-size: 1.5rem; }
  h3 { font-size: 1rem; }
  p { margin: 0; }
  a { color: inherit; font-weight: 700; }
  .meta { font-size: 0.875rem; color: var(--muted-foreground); }

  /* Gallery chrome (not part of the app) */
  .gallery { max-width: 76rem; margin: 0 auto; padding: 32px 16px 64px; }
  .gallery > header { margin-bottom: 24px; }
  .gallery > header h1 { font-size: 3rem; }
  .shot { margin: 40px 0 0; }
  .shot > figcaption { font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .shot > figcaption span { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted-foreground); }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: start; }
  .phone { width: 390px; max-width: 100%; }

  /* App frame */
  .app { container-type: inline-size; border: 1.5px solid var(--silk-seam); border-radius: var(--radius); background: var(--background); overflow: hidden; flex: 1 1 0; min-width: 0; }
  .bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; background: var(--primary); color: var(--primary-foreground); }
  .wordmark { font-stretch: 62%; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .who { display: flex; align-items: center; gap: 8px; font-size: .875rem; }
  .bar-top .btn-ghost { color: var(--primary-foreground); }
  .bar-top .btn-ghost:hover { background: #2c2c33; }

  .btn { font: inherit; font-weight: 700; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.04em; border-radius: var(--radius); padding: 10px 16px; border: 1.5px solid var(--primary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-outline { background: var(--card); color: var(--foreground); }
  .btn-ghost { background: none; border-color: transparent; color: var(--foreground); }
  .btn-sm { padding: 4px 10px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn-block { width: 100%; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn) } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .badge svg, .alert svg, .toast svg, .done svg { width: 16px; height: 16px; flex: none; }
  .credited { color: var(--success); background: var(--success-surface); }
  .declined, .failed { color: var(--destructive); background: var(--destructive-surface); }
  .unknown { color: var(--warning); background: var(--warning-surface); }
  .pending { color: var(--muted-foreground); background: var(--muted); }

  .alert { display: flex; gap: 10px; padding: 12px; border-radius: var(--radius); font-size: 0.875rem; margin-bottom: 16px; }
  .alert svg { margin-top: 2px; }
  .alert strong { display: block; }
  .alert.neutral { background: var(--muted); color: var(--foreground); }

  /* Forms */
  .field { display: grid; gap: 4px; margin-bottom: 14px; min-width: 0; }
  .field label { font-weight: 700; font-size: 0.875rem; }
  .field input { font: inherit; width: 100%; min-width: 0; padding: 9px 12px; border: 1.5px solid var(--input); border-radius: var(--radius); background: var(--card); color: var(--foreground); }
  .field input::placeholder { color: var(--muted-foreground); }
  .field input[aria-invalid="true"] { border-color: var(--destructive); }
  .field input[readonly] { background: var(--muted); }
  .field .err { color: var(--destructive); font-size: 0.875rem; }
  .field .hint { color: var(--muted-foreground); font-size: 0.875rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Auth */
  .auth { display: grid; place-items: start center; padding: 40px 16px 48px; }
  .auth-box { width: min(26rem, 100%); }
  .auth-box h1 { font-size: 1.5rem; margin: 16px 0 4px; }
  .auth-box > .meta { margin-bottom: 24px; }
  .auth-alt { margin-top: 16px; font-size: .875rem; text-align: center; }
  .silks-row { display: flex; gap: 6px; }

  /* Dashboard */
  .dash-head { padding: 24px 20px 0; }
  .purse { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding: 16px 20px 24px; }
  .amount { font-size: 3rem; font-weight: 900; font-stretch: 75%; line-height: 1; }
  .amount small { font-size: 1rem; font-weight: 700; color: var(--muted-foreground); margin-left: 6px; }
  .confirming { margin-top: 8px; display: flex; gap: 6px; align-items: center; font-size: .875rem; color: var(--warning); }
  .confirming svg { width: 14px; height: 14px; }
  .seam { border-top: 1.5px dashed var(--border); }
  .boards { display: grid; grid-template-columns: 2fr 1fr; }
  .boards > div { padding: 20px; }
  .boards > div + div { border-left: 1.5px dashed var(--border); }
  .boards h3, .history h3, .sim h3 { margin-bottom: 4px; }
  .history, .sim { padding: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; margin-top: 8px; }
  th { text-align: left; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-foreground); padding: 8px; border-bottom: 1.5px solid var(--foreground); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td .meta { display: block; margin-top: 2px; }
  .num { text-align: right; font-weight: 700; }
  .bars rect.bar { stroke: var(--silk-seam); stroke-width: 1.5; }
  .empty { padding: 24px 0 8px; }
  .sk { background: var(--muted); border-radius: var(--radius); }
  .sim-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; font-size: .875rem; font-weight: 700; }
  .switch i { width: 40px; height: 22px; border-radius: 999px; background: var(--input); position: relative; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); }
  .switch.on i { background: var(--destructive); }
  .switch.on i::after { left: 21px; }
  .hide-sm {}
  @container (max-width: 720px) {
    .boards { grid-template-columns: 1fr; }
    .boards > div + div { border-left: 0; border-top: 1.5px dashed var(--border); }
    .hide-sm { display: none; }
    .purse .btn { width: 100%; }
    .who .name { display: none; }
    .amount { font-size: 2.5rem; }
  }

  /* Dialog */
  .scrim { background: var(--scrim); padding: 32px 16px; display: grid; place-items: center; border-radius: var(--radius); flex: 1 1 22rem; min-width: 0; }
  .dialog { background: var(--popover); border-radius: calc(var(--radius) + 2px); box-shadow: var(--shadow-dialog); width: min(28rem, 100%); padding: 24px; }
  .dialog h2 { margin-bottom: 4px; }
  .dialog .sub { margin-bottom: 16px; }
  .actions { display: flex; justify-content: end; gap: 8px; margin-top: 4px; }
  details { margin-top: 16px; font-size: .875rem; border-top: 1px solid var(--border); padding-top: 12px; }
  summary { cursor: pointer; font-weight: 700; }
  details table { margin-top: 4px; }
  details td, details th { padding: 6px 4px; }
  .done { text-align: center; padding: 8px 0; }
  .done .mark { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; }
  .done .mark svg { width: 24px; height: 24px; }
  .done .big { font-size: 2.25rem; font-weight: 900; font-stretch: 75%; line-height: 1; margin: 8px 0; }
  dl.receipt { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; text-align: left; font-size: .875rem; margin: 16px 0; padding: 12px; background: var(--muted); border-radius: var(--radius); }
  dl.receipt dt { color: var(--muted-foreground); }
  dl.receipt dd { margin: 0; font-weight: 700; text-align: right; }

  /* Toasts */
  .toast { display: flex; gap: 10px; align-items: start; background: var(--popover); box-shadow: var(--shadow-float); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: .875rem; width: 22rem; max-width: 100%; }
  .toast strong { display: block; }

  /* Copy table */
  .copy { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 8px 16px 16px; }
  .copy td:first-child { font-family: ui-monospace, monospace; font-size: .8rem; }
</style>
</head>
