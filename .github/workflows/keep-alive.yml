name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.KEEP_ALIVE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "$KEEP_ALIVE_URL/api/health"
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL }}
